# Copie para config/discovery.yaml (ignorado pelo git). SO o que estiver em `parameters` pode variar.
# Nada aqui altera um EA: o resultado e um relatorio + .set candidato em outputs/discovery/<data>/.

settings:
  is_days: 240             # janela de busca (treino). A sub-barra do motor se ajusta ao que o terminal alcanca
  oos_days: 60             # janela de teste: a busca NUNCA a ve
  trials: 300              # combinacoes sorteadas por ativo (alem da referencia). ~0,1 s cada
  top_k: 5                 # finalistas que passam pelos testes de OOS, consistencia e vizinhanca
  seed: 42                 # mesma semente = mesmas combinacoes
  min_trades_is: 30
  min_trades_oos: 10
  folds: 3                 # trechos do IS para o teste de consistencia (0 = nao testar)
  min_positive_folds: 2    # E[R] > 0 em pelo menos tantos trechos
  max_drawdown_pct: 5.0    # OBRIGATORIO: teto de drawdown (saldo fechado) em %

strategies:
  IdxSwing91:
    tickers: [DAX40]       # ativo com baseline proprio. Ativo sem baseline usa `template` como base
    # template: "DAX40"    #   (referencia NAO validada nesse ativo; SL em pontos muda de escala)
    # timeframe: M12
    parameters:
      InpATRMultiplier: {type: float, min: 0.8, max: 3.0, step: 0.2}
      InpTP_RMultiple:  {type: float, min: 1.0, max: 3.0, step: 0.2}
      InpUseTrailing:   {type: bool}
      InpSLBufferPoints: {type: int, factors: [0.5, 0.75, 1.0, 1.5, 2.0]}   # relativo ao valor do baseline

  BreakoutDonchian1:
    tickers: [NAS100]
    parameters:
      InpDonchianPeriod:       {type: int,   min: 10,  max: 60,  step: 5}
      InpSLATRMultiplier:      {type: float, min: 1.0, max: 3.0, step: 0.25}
      InpTP_RMultiple:         {type: float, values: [0, 1.5, 2.0, 3.0, 4.0]}   # 0 = sem TP
      InpTrailATRMultiplier:   {type: float, min: 1.0, max: 4.0, step: 0.5}

# Recusados de proposito (nao criam edge ou identificam o EA): InpMagicNumber, InpTradeComment,
# InpLogLevel, InpRiskPercent, InpFixedLot, InpUseFixedLot.
