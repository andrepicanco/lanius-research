# Copie para config/monitor.yaml (ignorado pelo git) e ajuste.

# Pasta com os relatórios de baseline (.xlsx exportados do Strategy Tester).
# Cada arquivo traz EA, ativo, timeframe, período e todos os inputs; o nome do arquivo não importa.
baseline_dir: 'C:\Users\15339\AppData\Roaming\MetaQuotes\Terminal\98832BEDFCD443328B914728FFAC3D44\MQL5\Profiles\strategy_baseline'

# Abaixo disso o veredito de win rate nunca passa de ATENCAO (amostra pequena demais).
min_trades: 30

thresholds:
  confidence: 0.95          # nível do intervalo de Wilson para o win rate
  dd_fail_factor: 1.5       # FALHA se o DD% corrente > fator * DD% do baseline
  max_drawdown_pct: null    # teto absoluto de DD% (null = sem teto). Também limita o item 2.
  trades_per_month_ratio: [0.5, 2.0]   # fora dessa faixa vs baseline -> ATENCAO (comportamento mudou)

# Terminal PORTATIL dedicado a backtests (copia do programa, aberta com /portable e logada uma vez
# numa conta demo). NUNCA aponte para o terminal que opera: com ele aberto o /config e ignorado.
tester:
  terminal_dir: 'C:\Users\15339\Lanius-MT5-Tester'
  timeout_minutes: 30
  model: 0              # 0 = Cada tick (modelagem dos baselines)
  execution_mode: 20    # latencia em ms (a dos baselines)
  min_free_gb: 1.0      # recusa rodar com menos que isso livre no disco
  max_terminal_mb: 500  # acima disso apaga o historico baixado depois do run (volta a baixar)
  warmup_days: 30       # dias antes do fim do baseline para aquecer indicadores no run
  keep_reports: 10      # relatorios mantidos por baseline em outputs/
  experts: {}           # so se a pasta do EA nao tiver o mesmo nome dele, ex.: IdxSwing91: 'Outra\IdxSwing91.ex5'

# Onde ficam os relatorios gerados pelos runs (default: outputs/ no projeto)
# outputs_dir: 'C:\...'

# Credenciais do Telegram NUNCA vao aqui: ficam em strategy-monitor/.env (ignorado pelo git;
# modelo em .env.example) ou em variaveis de ambiente TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID.

# Motor Python (backtest sem o Strategy Tester): le barras da instancia do MT5 que voce usa, JA ABERTA e logada.
# Somente leitura (nunca envia ordens). O cache fica em data_cache/ (ignorado pelo git) e cresce a cada uso.
mt5:
  terminal_path: 'C:\caminho\do\terminal64.exe'
  # cache_dir: 'C:\...'     # default: data_cache/ no projeto
